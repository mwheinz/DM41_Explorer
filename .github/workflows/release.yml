name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Builds a standalone binary on Linux (x86_64 and arm64), macOS, and
# Windows (x86_64 and arm64) via build.sh / dm41explorer.spec, zips each one up
# with a checksum, and publishes them all to a GitHub Release named after
# the tag.
#
# PyInstaller can't cross-compile, so each arm64 build needs its own
# native runner rather than a flag on the corresponding x86_64 leg:
# ubuntu-24.04-arm (GitHub-hosted Linux ARM64, GA 2025-08-07) and
# windows-11-arm (GitHub-hosted Windows ARM64, still Public Preview as of
# writing -- expect more rough edges there than the Linux leg, e.g. the
# 7-Zip that ships on it currently runs under x64 emulation rather than
# natively, which is why Windows packaging below uses PowerShell's
# built-in Compress-Archive instead). Both are free and unlimited on
# public repos, same as the x86_64 runners.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # build.sh embeds `git describe --tags` as the app version, which
          # needs real tag history, not the default shallow clone.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          # See test.yml: works around an intermittent broken Tcl/Tk bundle
          # in the pre-baked Windows runner Python tool cache.
          check-latest: true

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build
        shell: bash
        run: src/build.sh

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Both the x86_64 and arm64 legs hit this step (runner.os reads
          # "Linux" for either), so the filename has to reflect the actual
          # host arch rather than assuming x86_64 -- otherwise the two
          # legs would produce identically-named zips that collide when
          # the publish job merges all artifacts into one directory.
          case "$(uname -m)" in
            x86_64) ARCH=x86_64 ;;
            aarch64) ARCH=arm64 ;;
            *) ARCH="$(uname -m)" ;;
          esac
          cd src/dist
          zip -r "../../DM41_Explorer-${{ github.ref_name }}-linux-${ARCH}.zip" dm41explorer
          cd ../..
          sha256sum "DM41_Explorer-${{ github.ref_name }}-linux-${ARCH}.zip" > "DM41_Explorer-${{ github.ref_name }}-linux-${ARCH}.zip.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Both the x64 and arm64 Windows legs hit this step (runner.os
          # reads "Windows" for either). Uses PowerShell's built-in
          # Compress-Archive/Get-FileHash rather than 7z + sha256sum (the
          # prior bash/7z approach) for two reasons: it needs no external
          # tool at all (7z on windows-11-arm currently only runs under
          # x64 emulation, per actions/runner-images#14065), and it's
          # naturally architecture-agnostic.
          $arch = $env:PROCESSOR_ARCHITECTURE.ToLower()
          if ($arch -eq "amd64") { $arch = "x86_64" }
          $zipName = "DM41_Explorer-${{ github.ref_name }}-windows-$arch.zip"
          Compress-Archive -Path "src/dist/dm41explorer" -DestinationPath $zipName
          $hash = (Get-FileHash -Algorithm SHA256 $zipName).Hash.ToLower()
          # Match `sha256sum`'s output format ("<hash>  <filename>") so the
          # checksum files stay consistent across every platform leg.
          "$hash  $zipName" | Out-File -Encoding ascii "$zipName.sha256"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd src/dist
          # ditto -c -k only ever accepts a single source when creating an
          # archive ("ditto: Can't archive multiple sources") -- it's used
          # here (rather than plain zip) specifically because it's the one
          # tool that zips a signed .app bundle without mangling its
          # resource forks / code-signing metadata, so the .app has to be
          # its own ditto call.
          ditto -c -k --sequesterRsrc --keepParent "DM41_Explorer.app" "../../DM41_Explorer-${{ github.ref_name }}-macos.zip"
          zip -r "../../DM41_Explorer-${{ github.ref_name }}-macos.zip" README.md LICENSE
          cd ../..
          shasum -a 256 "DM41_Explorer-${{ github.ref_name }}-macos.zip" > "DM41_Explorer-${{ github.ref_name }}-macos.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: dm41-explorer-${{ matrix.os }}
          path: |
            DM41_Explorer-*.zip
            DM41_Explorer-*.zip.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "DM41_Explorer ${{ github.ref_name }}" \
            --generate-notes
