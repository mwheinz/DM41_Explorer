name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm is a GitHub-hosted Linux ARM64 runner, free and
        # unlimited on public repos (like x64 runners) as of GA 2025-08-07.
        # windows-11-arm is the Windows ARM64 equivalent -- also free on
        # public repos, but still Public Preview (not GA) as of writing, so
        # expect more rough edges there than on the Linux arm64 leg. Every
        # step below keys off runner.os, which reads "Linux"/"Windows" for
        # either architecture, so no other changes are needed here.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          # Works around an intermittent GitHub-hosted Windows runner issue
          # where the pre-baked Python in the image's tool cache has an
          # incomplete Tcl/Tk bundle (missing ttk/*.tcl files -> tkinter
          # import fails). check-latest makes the action verify the cached
          # copy is actually the newest matching release and re-download
          # otherwise, instead of trusting whatever's pre-installed as-is.
          #
          # This does NOT fix the *other*, still-open Windows Tcl flake --
          # see the "Run tests (Windows)" step below -- and actually widens
          # its window: check-latest means every run freshly downloads and
          # unzips Python's Tcl/Tk bundle instead of reusing an
          # already-extracted tool-cache copy, and that fresh-extraction
          # window is exactly when the other bug bites. Keeping check-latest
          # anyway because the bug it fixes (files silently missing) is
          # deterministic and worse than the one it slightly worsens (files
          # present but transiently unreadable, self-heals on retry).
          check-latest: true

      - name: Install Linux GUI/test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Font-size / window-size scaling tests (issue #42) are skipped on every
      # runner: they pass locally but depend on how each OS and runner image
      # lays out real windows (e.g. macOS 26 on the runner vs. macOS 27), so
      # they were unreliable in CI. Run them locally with plain `pytest`.
      # The -k expression below is repeated in each test step; keep the three
      # copies identical. It matches test names containing "font", plus the
      # tests that are only parametrized on font_size.
      - name: Run tests (Linux, headless via Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest -k "not font and not size and not fixed_size_dialog and not connect_dialog_wraps and not mnemonics_notes_rewrap and not mnemonics_dialog_can_be_made_smaller and not no_cell_text_is_wider"

      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        run: pytest -k "not font and not size and not fixed_size_dialog and not connect_dialog_wraps and not mnemonics_notes_rewrap and not mnemonics_dialog_can_be_made_smaller and not no_cell_text_is_wider"

      # Windows-hosted runners have a well-known, still-unresolved
      # intermittent failure in actions/setup-python's Tcl/Tk bundle: Tcl
      # fails to source tcl8.6/init.tcl with "couldn't read file ...: No
      # error" even though the file is right there on disk -- see
      # https://github.com/actions/setup-python/issues/1102. It's
      # consistent with the file being transiently locked (most likely
      # Windows Defender's real-time scanner grabbing it right after
      # setup-python freshly extracts it -- see the check-latest comment
      # above) rather than actually missing or corrupt, which is why
      # simply re-running always seems to clear it. There's no known
      # permanent fix, so this retries the whole `pytest` invocation a
      # few times with a short pause instead of requiring a human to
      # notice the failure and click "Re-run failed jobs" -- the same
      # workaround already being done by hand, just automatic.
      - name: Run tests (Windows, retried -- see comment)
        if: runner.os == 'Windows'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 20
          command: pytest -k "not font and not size and not fixed_size_dialog and not connect_dialog_wraps and not mnemonics_notes_rewrap and not mnemonics_dialog_can_be_made_smaller and not no_cell_text_is_wider"
