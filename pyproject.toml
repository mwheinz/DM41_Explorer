[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "dm41-explorer"
description = "Read, write and edit the memory of a SwissMicros DM41L/DM41X calculator"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Michael Heinz" }]
requires-python = ">=3.10"
# What the app imports. requirements.txt pins these (and CustomTkinter's
# own dependencies) to the exact versions used for development and
# releases.
dependencies = [
    "customtkinter",
    "pyserial",
]
# The version comes from the latest git tag (vYYYY.MM.DD), as `git
# describe` does for the About box (see src/build.sh).
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/mwheinz/DM41_Explorer"

[project.scripts]
dm41explorer = "gui.app:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["engine", "gui", "memory"]
py-modules = ["config"]

# The XROM library files, which memory/xrom_library.py reads at import time.
[tool.setuptools.package-data]
memory = ["xroms/*.json"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]
extend-exclude = ["dm41-venv", "src/build", "src/dist"]

[tool.ruff.lint]
# Ruff's defaults: pyflakes (F) plus the pycodestyle errors that aren't
# about layout (E4, E7, E9). Layout itself is `ruff format`'s job.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# GUI tests skip themselves with pytest.importorskip() before importing
# CustomTkinter, so those imports can't be at the top of the file.
"src/tests/*.py" = ["E402"]
